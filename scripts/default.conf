# ============================================================
# OpenGL Renderer Ultimate — Default Configuration
# ============================================================
# Edit this file or use the WebUI to change settings
# Lines starting with # are comments
# Format: key=value
# ============================================================

# ---- CPU Settings ----
cpu_governor=performance
cpu_max_freq=
cpu_min_freq=
overclock_enabled=1
oc_governor=performance
oc_boost_freq=0
oc_boost_ms=50
cpu_idle_disable=0
core_ctl_enable=0

# ---- CPU Boost ----
input_boost_freq=0
input_boost_ms=50
sched_boost_on_input=1

# ---- Scheduler ----
sched_child_runs_first=1
sched_tunable_scaling=0
sched_latency_ns=1000000
sched_min_granularity_ns=500000
sched_wakeup_granularity_ns=500000
sched_migration_cost_ns=100000
sched_nr_migrate=4
sched_autogroup=0
sched_cfs_bandwidth=5000
sched_energy_aware=1
schedutil_up_rate=500
schedutil_down_rate=20000

# ---- GPU Settings ----
gpu_governor=performance
gpu_overclock_enabled=1
gpu_freq_max=
gpu_devfreq_max=
gpu_devfreq_min=

# ---- Adreno Specific ----
adreno_force_clk=1
adreno_idle_timer=0
adreno_force_bus=1
adreno_force_rail=1
adreno_preemption=50

# ---- Mali Specific ----
mali_util_period=16

# ---- RAM Settings ----
swappiness=120
dirty_ratio=50
dirty_background_ratio=15
dirty_writeback=500
dirty_expire=3000
vfs_cache_pressure=40
min_free_kbytes=16384
extra_free_kbytes=12288
watermark_boost=15000
watermark_scale=100
page_cluster=3
overcommit_memory=0
overcommit_ratio=50

# ---- ZRAM Settings ----
zram_size=
zram_algorithm=lz4
zram_max_streams=

# ---- I/O Settings ----
io_scheduler=bfq
readahead=4096
nr_requests=256
rq_affinity=2
nomerges=0
add_random=0
io_overclock=1
io_oc_scheduler=bfq

# ---- KSM Settings ----
ksm_run=1
ksm_pages_to_scan=200
ksm_sleep=20
ksm_max_sharing=256

# ---- Zswap Settings ----
zswap_enabled=Y
zswap_max_pool=25
zswap_compressor=lz4
zswap_zpool=z3fold

# ---- THP Settings ----
thp_enabled=madvise
thp_defrag=defer+madvise

# ---- Kernel Settings ----
kernel_preempt=1
kernel_preemptive=1
fsync=1
bpf_jit=1
sysrq=0
ptrace_scope=0
unprivileged_userns=1
kernel_panic=10
panic_on_oops=1
printk=1 4 1 7

# ---- Network Settings ----
tcp_congestion=bbr
default_qdisc=fq
tcp_rmem_max=16777216
tcp_wmem_max=16777216
tcp_rmem_default=1048576
tcp_wmem_default=1048576
tcp_rmem=4096 1048576 16777216
tcp_wmem=4096 1048576 16777216
tcp_fastopen=3
tcp_slow_start=0
tcp_mtu_probe=1
tcp_sack=1
tcp_timestamps=1
tcp_window_scaling=1
tcp_no_metrics=1
tcp_frto=2
tcp_ecn=0
tcp_adv_win=1
tcp_keepalive=600
tcp_keepalive_intvl=30
tcp_keepalive_probes=5
netdev_backlog=8192
somaxconn=8192
tcp_syncookies=1

# ---- Thermal Settings ----
thermal_headroom=10000
thermal_mode=performance
thermal_polling=2000
cpu_throttle_temp=98000
gpu_throttle_temp=98000

# ---- Bus Settings ----
bus_overclock=1

# ---- Governor Lock ----
governor_lock=1
global_boost_freq=0
global_boost_ms=50
