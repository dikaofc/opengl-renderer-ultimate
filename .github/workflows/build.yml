name: Build Flashable ZIP + Tile APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip

      - name: Make scripts executable
        run: |
          chmod -R +x *.sh scripts/*.sh META-INF/com/google/android/update-binary

      - name: Validate shell scripts
        run: |
          echo "=== Syntax Check ==="
          FAIL=0
          for f in *.sh scripts/*.sh; do
            if bash -n "$f" 2>&1; then
              echo "[OK] $f"
            else
              echo "[FAIL] $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "Script syntax check failed!"
            exit 1
          fi
          echo "All scripts valid!"

      - name: JS syntax check
        run: |
          node --check webroot/app.js 2>&1 && echo "[OK] app.js" || echo "[WARN] node not available, skipping"
        continue-on-error: true

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "^version=" module.prop | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build flashable ZIP
        run: |
          ZIP_NAME="OpenGL_Renderer_Ultimate_${{ steps.version.outputs.version }}_Flashable.zip"
          zip -r9 "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore" \
            -x "LICENSE" \
            -x "build_zip/*" \
            -x "helper-app/*"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Built: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Count files
        run: |
          echo "=== ZIP Contents ==="
          unzip -l "$ZIP_NAME" | tail -3
          echo ""
          FILE_COUNT=$(unzip -l "$ZIP_NAME" | tail -1 | awk '{print $2}')
          echo "Total files in ZIP: $FILE_COUNT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Renderer-Ultimate-${{ steps.version.outputs.version }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      # ---- Build Helper Tile APK ----
      - name: Set up JDK 17
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-36 platforms;android-35 platforms;android-34'

      - name: Build Tile APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd helper-app

          # Find build-tools
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using: $BUILD_TOOLS"

          AAPT2="$BUILD_TOOLS/aapt2"
          D8="$BUILD_TOOLS/d8"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          mkdir -p build/compiled_res build/classes build/gen

          # Find latest platform (prefer android-35, fallback to any)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-3* 2>/dev/null | sort -V | tail -1)
          echo "Using platform: $PLATFORM"

          # Compile resources
          "$AAPT2" compile --dir res -o build/compiled_res/

          # Link (min API 24, target API 35 — supports Android 7.0 to 16)
          "$AAPT2" link \
            -o build/unsigned.apk \
            -I "$PLATFORM/android.jar" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            --min-sdk-version 24 \
            --target-sdk-version 35 \
            build/compiled_res/*.flat

          # Compile Java (include gen/ for R.java)
          find src build/gen -name "*.java" > build/sources.txt
          javac \
            -source 11 -target 11 \
            -classpath "$PLATFORM/android.jar" \
            -d build/classes \
            @build/sources.txt

          # DEX
          find build/classes -name "*.class" > build/classfiles.txt
          "$D8" \
            --output build/ \
            --min-api 24 \
            --lib "$PLATFORM/android.jar" \
            @build/classfiles.txt

          # Add DEX to APK
          cd build
          cp unsigned.apk unsigned_with_dex.apk
          zip -j unsigned_with_dex.apk classes.dex
          cd ..

          # Align
          "$ZIPALIGN" -f 4 build/unsigned_with_dex.apk build/aligned.apk

          # Generate keystore
          keytool -genkeypair \
            -keystore build/debug.keystore \
            -storepass android \
            -keypass android \
            -alias debugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debug,O=Debug,C=US" 2>/dev/null

          # Sign
          "$APKSIGNER" sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias debugkey \
            --out build/ore-tile.apk \
            build/aligned.apk

          echo "TILE_APK=helper-app/build/ore-tile.apk" >> $GITHUB_ENV
          echo "Built: helper-app/build/ore-tile.apk"
          ls -lh build/ore-tile.apk

      # ---- Release ----
      - name: Update update.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/OpenGL_Renderer_Ultimate_${VERSION}_Flashable.zip"
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          
          cat > update.json << EOF
          {
            "version": "${VERSION}",
            "versionCode": $(echo "$VERSION" | sed 's/v//' | tr -d '.'),
            "zipUrl": "${ZIP_URL}",
            "changelog": "${CHANGELOG_URL}",
            "note": "OpenGL Renderer Ultimate ${VERSION}"
          }
          EOF
          echo "Updated update.json for ${VERSION}"
          cat update.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.TILE_APK }}
            update.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          additional_files: '*.sh scripts/*.sh'
        continue-on-error: true
